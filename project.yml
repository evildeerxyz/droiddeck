name: DroidDeck
options:
  bundleIdPrefix: app.droiddeck
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  DroidDeckKit:
    path: Packages/DroidDeckKit
targets:
  DroidDeck:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DroidDeckKit
        product: DroidDeckKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DroidDeck
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 DroidDeck"
        NSLocalNetworkUsageDescription: "DroidDeck connects to Android emulators running on this Mac."
    entitlements:
      path: App/DroidDeck.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.droiddeck.DroidDeck
        PRODUCT_NAME: DroidDeck
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
schemes:
  DroidDeck:
    build:
      targets:
        DroidDeck: all
    run:
      config: Debug
    archive:
      config: Release
